# GitLab CI/CD Configuration for CloudCLI Multi-User Container Images
# Automatically builds and pushes container images to GitLab Container Registry

variables:
  # GitLab Container Registry path (automatically set by GitLab)
  REGISTRY: $CI_REGISTRY
  IMAGE_PATH: $CI_REGISTRY_IMAGE

  # Build configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # Use buildkit for faster builds
  DOCKER_BUILDKIT: "1"

stages:
  - build
  - push
  - release

# Build gateway image
build:gateway:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building gateway image..."
    - docker build
        -t "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}"
        -t "${IMAGE_PATH}/gateway:${CI_COMMIT_REF_SLUG}"
        -f Dockerfile .
    - echo "Pushing gateway image..."
    - docker push "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_PATH}/gateway:${CI_COMMIT_REF_SLUG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  tags:
    - docker

# Build worker image
build:worker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building worker image..."
    - docker build
        -t "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}"
        -t "${IMAGE_PATH}/worker:${CI_COMMIT_REF_SLUG}"
        -f docker/worker/Dockerfile .
    - echo "Pushing worker image..."
    - docker push "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_PATH}/worker:${CI_COMMIT_REF_SLUG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  tags:
    - docker

# Tag latest on main branch
push:latest:
  stage: push
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Tagging images as latest..."
    # Pull commit-specific images
    - docker pull "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}"
    - docker pull "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}"
    # Tag as latest
    - docker tag "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/gateway:latest"
    - docker tag "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/worker:latest"
    # Push latest tags
    - docker push "${IMAGE_PATH}/gateway:latest"
    - docker push "${IMAGE_PATH}/worker:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build:gateway
    - build:worker
  tags:
    - docker

# Create release tags (for version tags like v1.0.0)
release:tags:
  stage: release
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Creating release tags for version ${CI_COMMIT_TAG}..."
    # Pull commit-specific images
    - docker pull "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}"
    - docker pull "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}"
    # Extract version without 'v' prefix
    - VERSION=${CI_COMMIT_TAG#v}
    # Tag with version
    - docker tag "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/gateway:${VERSION}"
    - docker tag "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/worker:${VERSION}"
    # Tag as stable
    - docker tag "${IMAGE_PATH}/gateway:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/gateway:stable"
    - docker tag "${IMAGE_PATH}/worker:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PATH}/worker:stable"
    # Push all tags
    - docker push "${IMAGE_PATH}/gateway:${VERSION}"
    - docker push "${IMAGE_PATH}/worker:${VERSION}"
    - docker push "${IMAGE_PATH}/gateway:stable"
    - docker push "${IMAGE_PATH}/worker:stable"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - build:gateway
    - build:worker
  tags:
    - docker

# Optional: Build and test on merge requests (without pushing)
build:test:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - echo "Testing build for merge request..."
    - docker build -f Dockerfile -t gateway-test .
    - docker build -f docker/worker/Dockerfile -t worker-test .
    - echo "Build test successful!"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - docker
